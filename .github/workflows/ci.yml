name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: minibank
          POSTGRES_USER: minibank
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U minibank -d minibank"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGDATABASE: minibank
      PGUSER: minibank
      ONTOLOGY_PATH: ontology/retail_banking
      LLM_MODE: mock
      RUN_POSTGRES_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Initialize MiniBank schema and seed
        run: |
          psql -v ON_ERROR_STOP=1 -f data/ddl/001_schema.sql
          psql -v ON_ERROR_STOP=1 -f data/ddl/002_ontology_builder.sql
          psql -v ON_ERROR_STOP=1 -f data/ddl/003_release_safety_and_search.sql
          psql -v ON_ERROR_STOP=1 -f data/ddl/004_sql_assets.sql
          psql -v ON_ERROR_STOP=1 -f data/ddl/005_sql_asset_builds.sql
          psql -v ON_ERROR_STOP=1 -f data/ddl/006_evaluation.sql
          psql -v ON_ERROR_STOP=1 -f data/ddl/006_ontology_manager_core.sql
          psql -v ON_ERROR_STOP=1 -f data/ddl/007_ontology_runtime_governance.sql
          psql -v ON_ERROR_STOP=1 -f data/ddl/008_ontology_analysis_semantics.sql
          psql -v ON_ERROR_STOP=1 -f data/ddl/009_ontology_release_governance.sql
          psql -v ON_ERROR_STOP=1 -f data/seed/002_seed.sql
      - run: python -m pip install -e ".[dev]"
      - name: Print reproducibility identity
        run: |
          echo "Git SHA: ${GITHUB_SHA}"
          python --version
          psql -tAc "SELECT version()"
          psql -tAc "
            SELECT concat_ws('|',
              'ontology_version=' || COALESCE(v.version, 'not-published'),
              'resource_hash=' || COALESCE(a.source_resource_hash, 'not-available'),
              'bundle_hash=' || COALESCE(a.bundle_hash, 'not-available'),
              'compiler_version=' || COALESCE(a.compiler_version, 'not-available'))
            FROM (SELECT 1) AS singleton
            LEFT JOIN ontology_version v ON v.is_current
            LEFT JOIN ontology_compiled_artifact a ON a.ontology_version_id = v.version_id
            LIMIT 1"
      - run: ruff check .
      - run: pytest
      - name: Validate benchmark Gold SQL
        run: |
          set -o pipefail
          python -m data_asset_agents.evaluation.cli validate-benchmark 2>&1 | tee benchmark.log
      - name: Validate benchmark result hashes
        run: |
          set -o pipefail
          python scripts/materialize_benchmark_hashes.py --check 2>&1 | tee -a benchmark.log
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics
          path: benchmark.log
          if-no-files-found: ignore

  compose-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run fresh Docker Compose acceptance
        shell: pwsh
        run: |
          & ./scripts/acceptance.ps1 `
            -ComposeProject data-asset-agents-fresh `
            -TimeoutSeconds 180 *>&1 |
            Tee-Object -FilePath acceptance.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run existing-database upgrade acceptance
        shell: pwsh
        run: |
          & ./scripts/upgrade_acceptance.ps1 `
            -ComposeProject data-asset-agents-upgrade `
            -TimeoutSeconds 180 *>&1 |
            Tee-Object -FilePath upgrade-acceptance.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload Compose diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-diagnostics
          path: |
            acceptance.log
            upgrade-acceptance.log
          if-no-files-found: ignore
