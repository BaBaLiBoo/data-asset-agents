services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - "5432:5432"
    volumes:
      - minibank_data:/var/lib/postgresql/data
      - ./data/ddl/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
      - ./data/ddl/002_ontology_builder.sql:/docker-entrypoint-initdb.d/002_ontology_builder.sql:ro
      - ./data/ddl/003_release_safety_and_search.sql:/docker-entrypoint-initdb.d/003_release_safety_and_search.sql:ro
      - ./data/ddl/004_sql_assets.sql:/docker-entrypoint-initdb.d/004_sql_assets.sql:ro
      - ./data/ddl/005_sql_asset_builds.sql:/docker-entrypoint-initdb.d/005_sql_asset_builds.sql:ro
      - ./data/ddl/006_evaluation.sql:/docker-entrypoint-initdb.d/006_evaluation.sql:ro
      - ./data/seed/002_seed.sql:/docker-entrypoint-initdb.d/002_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: ${DOCKER_DATABASE_URL:?DOCKER_DATABASE_URL must be set}
      DATABASE_CONNECT_TIMEOUT: ${DATABASE_CONNECT_TIMEOUT:-5}
      SQL_STATEMENT_TIMEOUT_MS: ${SQL_STATEMENT_TIMEOUT_MS:-5000}
      SQL_MAX_ROWS: ${SQL_MAX_ROWS:-200}
      LLM_MODE: ${LLM_MODE:-mock}
      LLM_PROVIDER: ${LLM_PROVIDER:-deepseek}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-2048}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-2}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-aliyun}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-v4}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1024}
      ONTOLOGY_PATH: ${ONTOLOGY_PATH:-ontology/retail_banking}
      HISTORICAL_SQL_PATH: ${HISTORICAL_SQL_PATH:-data/historical_sql/examples.json}
      EVALUATION_BENCHMARK_PATH: ${EVALUATION_BENCHMARK_PATH:-data/benchmark/text2sql_v1.json}
      EVALUATION_LIVE_CONCURRENCY: ${EVALUATION_LIVE_CONCURRENCY:-1}
      EVALUATION_SMOKE_CONCURRENCY: ${EVALUATION_SMOKE_CONCURRENCY:-2}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build: .
    command: ["streamlit", "run", "apps/web/app.py", "--server.address=0.0.0.0", "--server.port=8501"]
    environment:
      API_BASE_URL: ${WEB_API_BASE_URL:-http://api:8000}
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy

volumes:
  minibank_data:
