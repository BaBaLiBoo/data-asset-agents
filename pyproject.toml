[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "data-asset-agents"
version = "0.1.0"
description = "Ontology-first enterprise Text-to-SQL agents"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "langchain-core>=0.3,<1",
  "langchain-openai>=0.3,<1",
  "langgraph>=0.2,<1",
  "networkx>=3.3,<4",
  "pgvector>=0.3,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "pyyaml>=6,<7",
  "sqlalchemy>=2.0,<3",
  "sqlglot>=26,<28",
  "streamlit>=1.39,<2",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-cov>=5,<7", "ruff>=0.8,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/data_asset_agents"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --disable-warnings"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

